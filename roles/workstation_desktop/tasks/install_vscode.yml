---
- name: Check if VSCode is installed
  ansible.builtin.command:
    cmd: code --version
  register: vscode_installed
  ignore_errors: true
  changed_when: false
  tags: vscode

- name: Install VSCode repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/microsoft.gpg] https://packages.microsoft.com/repos/code stable main"
    state: present
  when:
    - ansible_facts['os_family'] == 'Debian'
  tags: vscode

- name: Install VSCode
  become: true
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - vscode_installed.rc != 0
  tags: vscode

- name: Download VSCode rpm package
  ansible.builtin.get_url:
    url: https://code.visualstudio.com/sha/download?build=stable&os=linux-rpm-x64
    dest: /tmp/vscode_current_x86_64.rpm
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_architecture == 'x86_64'
    - vscode_installed.rc != 0
  tags: vscode

- name: Install VSCode on RedHat os families
  become: true
  ansible.builtin.dnf:
    name: /tmp/vscode_current_x86_64.rpm
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_architecture == 'x86_64'
    - vscode_installed.rc != 0
  tags: vscode

- name: Remove VSCode rpm package
  ansible.builtin.file:
    path: /tmp/vscode_current_x86_64.rpm
    state: absent
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_architecture == 'x86_64'
    - vscode_installed.rc != 0
  tags: vscode

- name: Install Code - OSS on Archlinux os families
  become: true
  ansible.builtin.package:
    name: code
    state: present
  when:
    - ansible_facts['os_family'] == 'Archlinux'
  tags: vscode
