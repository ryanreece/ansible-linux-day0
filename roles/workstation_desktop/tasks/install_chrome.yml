---
- name: Check if Chrome is installed
  ansible.builtin.command:
    cmd: google-chrome --version
  register: chrome_installed
  ignore_errors: true
  changed_when: false
  tags: chrome

- name: Download Chrome deb package
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    dest: /tmp/google-chrome-stable_current_amd64.deb
  when:
    - ansible_facts['os_family'] == 'Debian'
    - chrome_installed.rc != 0
  tags: chrome

- name: Import Google GPG key
  become: true
  ansible.builtin.rpm_key:
    state: present
    key: https://dl.google.com/linux/linux_signing_key.pub
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - chrome_installed.rc != 0
  tags: chrome

- name: Download Chrome rpm package
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
    dest: /tmp/google-chrome-stable_current_x86_64.rpm
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - chrome_installed.rc != 0
  tags: chrome

- name: Install Chrome on Debian os families
  become: true
  ansible.builtin.apt:
    deb: /tmp/google-chrome-stable_current_amd64.deb
  when:
    - ansible_facts['os_family'] == 'Debian'
    - chrome_installed.rc != 0
  tags: chrome

- name: Install Chrome on RedHat os families
  become: true
  ansible.builtin.dnf:
    name: /tmp/google-chrome-stable_current_x86_64.rpm
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - chrome_installed.rc != 0
  tags: chrome

- name: Install AUR build dependencies for Chrome on Archlinux os families
  become: true
  ansible.builtin.package:
    name:
      - base-devel
      - git
    state: present
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - chrome_installed.rc != 0
  tags: chrome

- name: Ensure AUR source directory exists for Chrome
  ansible.builtin.file:
    path: "{{ sources_dir }}/aur"
    state: directory
    mode: '0755'
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - chrome_installed.rc != 0
  tags: chrome

- name: Clone Chrome AUR package on Archlinux os families
  ansible.builtin.git:
    repo: https://aur.archlinux.org/google-chrome.git
    dest: "{{ sources_dir }}/aur/google-chrome"
    update: true
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - chrome_installed.rc != 0
  tags: chrome

- name: Build Chrome AUR package on Archlinux os families
  ansible.builtin.command:
    cmd: makepkg -f --noconfirm
  args:
    chdir: "{{ sources_dir }}/aur/google-chrome"
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - chrome_installed.rc != 0
  tags: chrome

- name: Find built Chrome AUR package on Archlinux os families
  ansible.builtin.find:
    paths: "{{ sources_dir }}/aur/google-chrome"
    patterns: "google-chrome-*.pkg.tar.*"
    file_type: file
  register: chrome_aur_packages
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - chrome_installed.rc != 0
  tags: chrome

- name: Install built Chrome AUR package on Archlinux os families
  become: true
  ansible.builtin.command:
    argv:
      - pacman
      - -U
      - --noconfirm
      - "{{ chrome_aur_packages.files | sort(attribute='mtime') | map(attribute='path') | list | last }}"
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - chrome_installed.rc != 0
    - chrome_aur_packages.files | length > 0
  tags: chrome

- name: Remove Chrome deb package
  ansible.builtin.file:
    path: /tmp/google-chrome-stable_current_amd64.deb
    state: absent
  when:
    - ansible_facts['os_family'] == 'Debian'
    - chrome_installed.rc != 0
  tags: chrome

- name: Remove Chrome rpm package
  ansible.builtin.file:
    path: /tmp/google-chrome-stable_current_x86_64.rpm
    state: absent
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - chrome_installed.rc != 0
  tags: chrome
