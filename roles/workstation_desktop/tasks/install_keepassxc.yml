---
- name: Install KeePassXC repo
  become: true
  ansible.builtin.apt_repository:
    repo: ppa:phoerious/keepassxc
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: keepassxc

- name: Install KeePassXC
  become: true
  ansible.builtin.package:
    name: keepassxc
    state: present
    update_cache: true
  tags: keepassxc
