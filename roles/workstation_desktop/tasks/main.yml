---
- name: Configure dark appearance preference
  ansible.builtin.include_tasks:
    file: install_dark_mode.yml
  when:
    - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Archlinux']
    - install_dark_mode | default(true)
  tags: dark_mode

- name: Install Nerd Fonts
  ansible.builtin.include_tasks:
    file: install_nerd_fonts.yml
  when: install_nerd_fonts | default(true)
  tags: nerd_fonts

- name: Install Alacritty
  ansible.builtin.include_tasks:
    file: install_alacritty.yml
  when: install_alacritty | default(true)
  tags: alacritty

- name: Install flameshot
  ansible.builtin.include_tasks:
    file: install_flameshot.yml
  when: install_flameshot | default(true)
  tags: flameshot

- name: Configure Hyprland settings
  ansible.builtin.include_tasks:
    file: install_hyprland_settings.yml
  when: install_hyprland_settings | default(true)
  tags: hyprland

- name: Install Fedora Sway desktop utilities
  ansible.builtin.include_tasks:
    file: install_sway.yml
  when:
    - ansible_distribution == 'Fedora'
    - install_sway | default(true)
  tags: sway

- name: Install Regolith
  ansible.builtin.include_tasks:
    file: install_regolith.yml
  when:
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version == '24.04'
    - install_regolith | default(true)
  tags: regolith

- name: Install KDE
  ansible.builtin.include_tasks:
    file: install_kde.yml
  when:
    - ansible_facts['os_family'] in ['RedHat', 'Archlinux']
    - install_kde | default(false)
  tags: kde

- name: Install Chrome
  ansible.builtin.include_tasks:
    file: install_chrome.yml
  when:
    - install_chrome | default(true)
  tags: chrome

- name: Install Microsoft keyring
  ansible.builtin.include_tasks:
    file: install_microsoft_keyring.yml
  when:
    - install_microsoft_edge | default(true) or
      install_vscode | default(true)
  tags:
    - microsoft_edge
    - vscode

- name: Install Microsoft Edge
  ansible.builtin.include_tasks:
    file: install_microsoft_edge.yml
  when:
    - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Archlinux']
    - install_microsoft_edge | default(true)
  tags: microsoft_edge

- name: Install VSCode
  ansible.builtin.include_tasks:
    file: install_vscode.yml
  when:
    - install_vscode | default(true)
  tags: vscode

- name: Install ulauncher
  ansible.builtin.include_tasks:
    file: install_ulauncher.yml
  when:
    - ansible_distribution == 'Ubuntu'
    - install_ulauncher | default(true)
  tags: ulauncher

- name: Install Remmina
  ansible.builtin.include_tasks:
    file: install_remmina.yml
  when:
    - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Archlinux']
    - install_remmina | default(true)
  tags: remmina

- name: Install KeePassXC
  ansible.builtin.include_tasks:
    file: install_keepassxc.yml
  when:
    - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Archlinux']
    - install_keepassxc | default(true)
  tags: keepassxc

- name: Install Codex
  ansible.builtin.include_tasks:
    file: install_codex.yml
  when: install_codex | default(true)
  tags: codex

- name: Install Claude Code
  ansible.builtin.include_tasks:
    file: install_claude_code.yml
  when: install_claude_code | default(true)
  tags: claude_code
