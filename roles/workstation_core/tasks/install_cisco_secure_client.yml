---
- name: Check if Cisco Secure Client VPN UI exists
  ansible.builtin.stat:
    path: /opt/cisco/anyconnect/bin/vpnui
  register: cisco_secure_client_vpnui
  tags:
    - cisco_secure_client
    - vpn

- name: Set Cisco Secure Client package facts
  ansible.builtin.set_fact:
    cisco_secure_client_version: 5.1.17.3394
    cisco_secure_client_deb: cisco-secure-client-vpn_5.1.17.3394_amd64.deb
    cisco_secure_client_rpm: cisco-secure-client-vpn-5.1.17.3394-1.x86_64.rpm
  when: not cisco_secure_client_vpnui.stat.exists
  tags:
    - cisco_secure_client
    - vpn

- name: Download Cisco Secure Client deb package
  ansible.builtin.get_url:
    url: "https://assets.reece.ai/bin/{{ cisco_secure_client_deb }}"
    dest: "/tmp/{{ cisco_secure_client_deb }}"
    mode: '0644'
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not cisco_secure_client_vpnui.stat.exists
  tags:
    - cisco_secure_client
    - vpn

- name: Install Cisco Secure Client on Debian os families
  become: true
  ansible.builtin.apt:
    deb: "/tmp/{{ cisco_secure_client_deb }}"
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not cisco_secure_client_vpnui.stat.exists
  tags:
    - cisco_secure_client
    - vpn

- name: Install rpm tooling for Cisco Secure Client on Archlinux os families
  become: true
  ansible.builtin.package:
    name: rpm-tools
    state: present
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - not cisco_secure_client_vpnui.stat.exists
  tags:
    - cisco_secure_client
    - vpn

- name: Download Cisco Secure Client rpm package
  ansible.builtin.get_url:
    url: "https://assets.reece.ai/bin/{{ cisco_secure_client_rpm }}"
    dest: "/tmp/{{ cisco_secure_client_rpm }}"
    mode: '0644'
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - not cisco_secure_client_vpnui.stat.exists
  tags:
    - cisco_secure_client
    - vpn

- name: Install Cisco Secure Client on Archlinux os families
  become: true
  ansible.builtin.command:
    argv:
      - rpm
      - -Uvh
      - --nodeps
      - "/tmp/{{ cisco_secure_client_rpm }}"
  args:
    creates: /opt/cisco/anyconnect/bin/vpnui
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - not cisco_secure_client_vpnui.stat.exists
  tags:
    - cisco_secure_client
    - vpn

- name: Remove Cisco Secure Client deb package
  ansible.builtin.file:
    path: "/tmp/{{ cisco_secure_client_deb }}"
    state: absent
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not cisco_secure_client_vpnui.stat.exists
  tags:
    - cisco_secure_client
    - vpn

- name: Remove Cisco Secure Client rpm package
  ansible.builtin.file:
    path: "/tmp/{{ cisco_secure_client_rpm }}"
    state: absent
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - not cisco_secure_client_vpnui.stat.exists
  tags:
    - cisco_secure_client
    - vpn
