---
- name: Install python3 and pip for Debian and RedHat os families
  become: true
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
    state: present
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']
  tags: python

- name: Install python and pip for Archlinux os families
  become: true
  ansible.builtin.package:
    name:
      - python
      - python-pip
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: python

- name: Install Python UV using the official install script
  ansible.builtin.shell: |
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.local/bin/uv"
  tags: python

- name: Install python3 packages for Debian os families
  become: true
  ansible.builtin.package:
    name:
      - python3-pylsp
      - python3-venv
      - python-is-python3
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: python

- name: Install pylsp via snap for RedHat os families
  become: true
  community.general.snap:
    name:
      - pylsp
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: python

- name: Install Python tooling for Archlinux os families
  become: true
  ansible.builtin.package:
    name:
      - python-lsp-server
      - python-virtualenv
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: python
