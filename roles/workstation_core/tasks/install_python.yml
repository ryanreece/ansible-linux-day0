---
- name: Install python3 and pip for common os families
  become: true
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
    state: present
  tags: python

- name: Install python3 packages for Debian os families
  become: true
  ansible.builtin.package:
    name:
      - python3-pylsp
      - python3-venv
      - python-is-python3
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: python

- name: Install pylsp via snap for RedHat os families
  become: true
  community.general.snap:
    name:
      - pylsp
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: python
