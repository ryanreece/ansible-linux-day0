---
- name: Install Ruby on Fedora
  become: true
  ansible.builtin.package:
    name: ruby
    state: present
  when: ansible_distribution == 'Fedora'
  tags: ruby

- name: Install rbenv
  ansible.builtin.git:
    repo: https://github.com/rbenv/rbenv.git
    dest: ~/.rbenv
    depth: 1
  tags: ruby

- name: Install ruby-build
  ansible.builtin.git:
    repo: https://github.com/rbenv/ruby-build.git
    dest: ~/.rbenv/plugins/ruby-build
    depth: 1
  tags: ruby

- name: List available Ruby versions from rbenv
  ansible.builtin.command:
    cmd: zsh -lc "~/.rbenv/bin/rbenv install -l"
  changed_when: false
  tags: ruby
