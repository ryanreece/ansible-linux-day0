---
- name: Install compilation tools for Debian os families
  become: true
  ansible.builtin.package:
    name:
      - autoconf
      - bison
      - build-essential
      - clang
      - cmake
      - gcc
      - gettext
      - ninja-build
      - patch
      - pkg-config
      - rustc
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: libraries

- name: Install essential libraries for Debian os families
  become: true
  ansible.builtin.package:
    name:
      - gir1.2-clutter-1.0
      - gir1.2-gtop-2.0
      - imagemagick
      - libdb-dev
      - libffi-dev
      - libgdbm-dev
      - libgdbm6
      - libgmp-dev
      - libjemalloc2
      - libmagickwand-dev
      - libncurses5-dev
      - libreadline-dev
      - libssl-dev
      - libvips
      - libyaml-dev
      - mupdf-tools
      - uuid-dev
      - zlib1g-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: libraries

- name: Install development tools for Debian os families
  become: true
  ansible.builtin.package:
    name:
      - gpg-agent
      - libmysqlclient-dev
      - libpq-dev
      - libsqlite3-0
      - postgresql-client
      - postgresql-client-common
      - redis-tools
      - sqlite3
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: libraries

- name: Install 'Development Tools' dnf group for RedHat os families
  become: true
  ansible.builtin.dnf:
    name: '@Development Tools'
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: libraries

- name: Install compliation tools and devel libs for RedHat os families
  become: true
  ansible.builtin.dnf:
    name:
      - cargo
      - cmake
      - fontconfig-devel
      - freetype-devel
      - libxcb-devel
      - libxkbcommon-devel
      - rust
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: libraries

- name: Install base development tools for Archlinux os families
  become: true
  ansible.builtin.package:
    name:
      - base-devel
      - clang
      - cmake
      - gettext
      - ninja
      - pkgconf
      - rust
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: libraries

- name: Install essential libraries for Archlinux os families
  become: true
  ansible.builtin.package:
    name:
      - clutter
      - gdbm
      - gmp
      - gobject-introspection
      - imagemagick
      - jemalloc
      - libffi
      - libgit2
      - libgtop
      - libvips
      - libyaml
      - mariadb-libs
      - mupdf-tools
      - ncurses
      - openssl
      - postgresql-libs
      - readline
      - redis
      - sqlite
      - zlib
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: libraries

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: '0755'
  tags: libraries

- name: Ensure directory exists {{ sources_dir }}
  ansible.builtin.file:
    path: "{{ sources_dir }}"
    state: directory
    mode: '0755'
  tags: libraries
