---
- name: Install required system packages for docker
  become: true
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - software-properties-common
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: docker

- name: Add docker gpg apt key
  become: true
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: docker

- name: Add docker repository on Debian os families
  become: true
  ansible.builtin.apt_repository:
    repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: docker

- name: Install Docker repository definition on Fedora
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'
  when: ansible_distribution == 'Fedora'
  tags: docker

- name: Install Docker repository definition on RedHat Enterprise Linux derivatives
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/rhel/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_distribution != 'Fedora'
  tags: docker

- name: Install docker packages for Archlinux os families
  become: true
  ansible.builtin.package:
    pkg:
      - docker
      - docker-buildx
      - docker-compose
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: docker

- name: Install docker packages
  become: true
  ansible.builtin.package:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-ce-rootless-extras
    state: present
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']
  tags: docker

- name: Add the following user to the docker group {{ ansible_user_id }}
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  tags: docker
