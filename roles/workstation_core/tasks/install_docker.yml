---
- name: Install required system packages for docker
  become: true
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - software-properties-common
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: docker

- name: Add docker gpg apt key
  become: true
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: docker

- name: Add docker repository on Debian os families
  become: true
  ansible.builtin.apt_repository:
    repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: docker

- name: Add dnf-plugins-core package for RedHat os families
  become: true
  ansible.builtin.package:
    name:
      - dnf-plugins-core
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: docker
    
- name: Add docker repository for RedHat os families
  become: true
  community.general.dnf_config_manager:
    name: https://download.docker.com/linux/rhel/docker-ce.repo
    state: enabled
  when: ansible_facts['os_family'] == 'RedHat'
  tags: docker

- name: Install docker packages
  become: true
  ansible.builtin.package:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-ce-rootless-extras
    state: present
  tags: docker

- name: Add the following user to the docker group {{ ansible_user_id }}
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  tags: docker
