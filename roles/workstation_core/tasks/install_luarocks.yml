---
- name: Install lua libraries
  become: true
  ansible.builtin.package:
    name:
      - lua5.1
    state: present
  tags: luarocks

- name: Install lua libraries for Debian os families
  become: true
  ansible.builtin.package:
    name:
      - liblua5.1-0
      - liblua5.1-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: luarocks
  
- name: Install lua libraries for RedHat os families
  become: true
  ansible.builtin.package:
    name:
      - compat-lua-devel
      - compat-lua-libs
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: luarocks

- name: Check if luarocks is installed
  ansible.builtin.command:
    cmd: luarocks --version
  register: luarocks_installed
  ignore_errors: true
  changed_when: false
  tags: luarocks

- name: Download and extract luarocks tarball
  ansible.builtin.unarchive:
    src: https://luarocks.org/releases/luarocks-3.11.1.tar.gz
    dest: "{{ sources_dir }}"
    remote_src: true
  when: luarocks_installed.rc != 0
  tags: luarocks

- name: Configure luarocks
  ansible.builtin.command:
    cmd: ./configure
  args:
    chdir: "{{ sources_dir }}/luarocks-3.11.1"
  when: luarocks_installed.rc != 0
  tags: luarocks

- name: Build luarocks
  community.general.make:
    chdir: "{{ sources_dir }}/luarocks-3.11.1"
  when: luarocks_installed.rc != 0
  tags: luarocks

- name: Install luarocks
  become: true
  community.general.make:
    chdir: "{{ sources_dir }}/luarocks-3.11.1"
    target: install
  when: luarocks_installed.rc != 0
  tags: luarocks

- name: Install luarocks socket
  become: true
  ansible.builtin.command:
    cmd: luarocks install luasocket
  when: luarocks_installed.rc != 0
  tags: luarocks
