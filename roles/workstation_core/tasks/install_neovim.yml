---
- name: Install Neovim dependencies for Debian and RedHat os families
  become: true
  ansible.builtin.package:
    name:
      - gnupg
      - gpg
      - ripgrep
      - xclip
      - xsel
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']
  tags: neovim

- name: Install Neovim dependencies for Archlinux os families
  become: true
  ansible.builtin.package:
    name:
      - gnupg
      - ripgrep
      - xclip
      - xsel
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: neovim

- name: Check if Neovim is installed
  ansible.builtin.command:
    cmd: nvim --version
  register: neovim_installed
  ignore_errors: true
  changed_when: false
  tags: neovim

- name: Set the installed Neovim version
  ansible.builtin.set_fact:
    installed_neovim_version: "{{ neovim_installed.stdout_lines[0] | regex_search('NVIM v([0-9.]+)', '\\1') | first }}"
  when: neovim_installed.rc == 0
  tags: neovim

- name: Fetch tags and force update if Neovim directory exists
  ansible.builtin.command:
    cmd: git fetch --tags --force
  args:
    chdir: "{{ sources_dir }}/neovim"
  when: neovim_installed.rc == 0
  ignore_errors: true
  changed_when: false
  tags: neovim

- name: Clone the Neovim repository
  ansible.builtin.git:
    repo: https://github.com/neovim/neovim
    dest: "{{ sources_dir }}/neovim"
    version: stable
    update: true
  tags: neovim

- name: Get the latest stable version tag from the Neovim repo
  ansible.builtin.command:
    cmd: git describe --tags --abbrev=0
  args:
    chdir: "{{ sources_dir }}/neovim"
  register: latest_neovim_version
  changed_when: false
  tags: neovim

- name: Remove the leading 'v' from the latest_neovim_version
  ansible.builtin.set_fact:
    latest_neovim_version_clean: "{{ latest_neovim_version.stdout | regex_replace('^v', '') }}"
  tags: neovim

- name: Build Neovim if not installed or version mismatch
  community.general.make:
    chdir: "{{ sources_dir }}/neovim"
    params:
      CMAKE_BUILD_TYPE: Release
  when: installed_neovim_version is not defined or installed_neovim_version != latest_neovim_version_clean
  tags: neovim

- name: Install Neovim
  become: true
  community.general.make:
    chdir: "{{ sources_dir }}/neovim"
    target: install
  when: installed_neovim_version is not defined or installed_neovim_version != latest_neovim_version_clean
  tags: neovim

- name: Set Neovim config paths
  ansible.builtin.set_fact:
    neovim_config_repo: https://github.com/ryanreece/neovim-config.git
    neovim_config_dir: "{{ ansible_env.HOME }}/.config/nvim"
    neovim_config_backup_dir: "{{ ansible_env.HOME }}/.config/nvim.pre-ansible"
  tags: neovim

- name: Check if Neovim config directory exists
  ansible.builtin.stat:
    path: "{{ neovim_config_dir }}"
  register: neovim_config_dir_stat
  tags: neovim

- name: Check if Neovim config directory is a git checkout
  ansible.builtin.stat:
    path: "{{ neovim_config_dir }}/.git"
  register: neovim_config_git_stat
  when: neovim_config_dir_stat.stat.exists
  tags: neovim

- name: Check Neovim config git origin
  ansible.builtin.command:
    cmd: git config --get remote.origin.url
  args:
    chdir: "{{ neovim_config_dir }}"
  register: neovim_config_origin
  ignore_errors: true
  changed_when: false
  when:
    - neovim_config_dir_stat.stat.exists
    - neovim_config_git_stat.stat.exists
  tags: neovim

- name: Set Neovim config managed state
  ansible.builtin.set_fact:
    neovim_config_managed: >-
      {{
        neovim_config_dir_stat.stat.exists
        and (neovim_config_git_stat.stat.exists | default(false))
        and (neovim_config_origin.rc | default(1)) == 0
        and (neovim_config_origin.stdout | default('')) in [
          neovim_config_repo,
          'git@github.com:ryanreece/neovim-config.git'
        ]
      }}
  tags: neovim

- name: Check if Neovim config backup directory exists
  ansible.builtin.stat:
    path: "{{ neovim_config_backup_dir }}"
  register: neovim_config_backup_stat
  when:
    - neovim_config_dir_stat.stat.exists
    - not neovim_config_managed | bool
  tags: neovim

- name: Stop if unmanaged Neovim config and backup both exist
  ansible.builtin.fail:
    msg: >-
      Refusing to overwrite {{ neovim_config_backup_dir }} while backing up
      unmanaged Neovim config at {{ neovim_config_dir }}. Move one of these
      directories and rerun the playbook.
  when:
    - neovim_config_dir_stat.stat.exists
    - not neovim_config_managed | bool
    - neovim_config_backup_stat.stat.exists
  tags: neovim

- name: Back up unmanaged Neovim config directory
  ansible.builtin.command:
    argv:
      - mv
      - "{{ neovim_config_dir }}"
      - "{{ neovim_config_backup_dir }}"
  args:
    creates: "{{ neovim_config_backup_dir }}"
    removes: "{{ neovim_config_dir }}"
  when:
    - neovim_config_dir_stat.stat.exists
    - not neovim_config_managed | bool
  tags: neovim

- name: Install Neovim config
  ansible.builtin.git:
    repo: "{{ neovim_config_repo }}"
    dest: "{{ neovim_config_dir }}"
    update: true
  tags: neovim
