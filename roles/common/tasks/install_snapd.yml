---
- name: Install snapd on RedHat Enterprise Linux derivatives
  become: true
  ansible.builtin.dnf:
    name: snapd
    state: present
    update_cache: true
  tags: packages

- name: Enable snapd socket
  become: true
  ansible.builtin.systemd_service:
    name: snapd.socket
    state: started
    enabled: true
  tags: packages

- name: Create classic snap symlink
  become: true
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
  tags: packages
