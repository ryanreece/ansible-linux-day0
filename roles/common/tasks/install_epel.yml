---
- name: Install the EPEL repository on RedHat Enterprise Linux derivatives
  ansible.builtin.include_role:
    name: geerlingguy.repo-epel
    apply:
      become: true
      tags:
        - packages
        - epel
  tags:
    - packages
    - epel

- name: Enable the CodeReady Builder (CRB) repository on Rocky and AlmaLinux
  become: true
  community.general.dnf_config_manager:
    name: crb
    state: enabled
  when: ansible_distribution in ['Rocky', 'AlmaLinux']
  tags:
    - packages
    - epel
