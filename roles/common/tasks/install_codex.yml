---
- name: Set Codex Node.js executable path
  ansible.builtin.set_fact:
    codex_node_bin_dir: >-
      {{ nvm_dir | default(ansible_env.HOME ~
          ('/.config/nvm' if ansible_facts['os_family'] == 'Archlinux' else '/.nvm')) }}/versions/node/v{{ nodejs_version }}/bin
  tags: codex

- name: Install Codex globally using npm
  become: false
  community.general.npm:
    name: "@openai/codex"
    global: true
    state: present
    executable: "{{ codex_node_bin_dir }}/npm"
  environment:
    PATH: "{{ codex_node_bin_dir }}:{{ ansible_env.PATH }}"
  tags: codex
