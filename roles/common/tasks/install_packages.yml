---
- name: Update apt package cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'
  tags: packages

- name: Update DNF package cache
  become: true
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts['os_family'] == 'RedHat'
  tags: packages

- name: Upgrade apt packages
  become: true
  ansible.builtin.apt:
    upgrade: dist
  when: ansible_facts['os_family'] == 'Debian'
  tags: packages

- name: Install terminal packages for Debian os families
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - btop
      - fzf
      - gnupg2
      - ripgrep
      #- zoxide
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: packages

- name: Install terminal packages for RedHat os families
  become: true
  ansible.builtin.package:
    name:
      - btop
      - fzf
      - ripgrep
      - libatomic
      - xz
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: packages

- name: Install terminal packages for Archlinux os families
  become: true
  ansible.builtin.package:
    name:
      - btop
      - dnsutils
      - fzf
      - ripgrep
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: packages

- name: Install terminal packages for common os families
  become: true
  ansible.builtin.package:
    name:
      - curl
      - git
      - git-lfs
      - net-tools
      - rsync
      - tar
      - unzip
      - vim
      - wget
      - whois
      - zip
    state: present
  tags: packages
