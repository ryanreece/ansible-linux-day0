---
- name: Update the package cache
  become: true
  ansible.builtin.package:
    update_cache: true
  tags: packages

- name: Upgrade apt packages
  become: true
  ansible.builtin.apt:
    upgrade: dist
  when: ansible_facts['os_family'] == 'Debian'
  tags: packages

- name: Install terminal packages for Debian os families
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - btop
      - fzf
      - gnupg2
      - ripgrep
      #- zoxide
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: packages

- name: Install terminal packages for RedHat os families
  become: true
  ansible.builtin.package:
    name:
      - btop
      - fzf
      - ripgrep
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: packages

- name: Install terminal packages for Archlinux os families
  become: true
  ansible.builtin.package:
    name:
      - btop
      - dnsutils
      - fzf
      - ripgrep
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: packages

- name: Install terminal packages for common os families
  become: true
  ansible.builtin.package:
    name:
      - curl
      - git
      - net-tools
      - unzip
      - vim
      - wget
      - whois
      - zip
    state: present
    update_cache: true
  tags: packages
