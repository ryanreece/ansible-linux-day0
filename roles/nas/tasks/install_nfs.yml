---
- name: Install NFS server packages
  become: true
  ansible.builtin.dnf:
    name:
      - nfs-utils
    state: present
  tags: nas_nfs

- name: Allow NFS to export read-write directories via SELinux
  become: true
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop:
    - nfs_export_all_rw
    - nfs_export_all_ro
  tags: nas_nfs

- name: Deploy NFS exports configuration
  become: true
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: '0644'
  notify: Reload exports
  tags: nas_nfs

- name: Set NFS server thread count
  become: true
  community.general.ini_file:
    path: /etc/nfs.conf
    section: nfsd
    option: threads
    value: "{{ nas_nfs_threads }}"
    mode: '0644'
  notify: Restart nfs-server
  tags: nas_nfs

- name: Disable RDMA in nfs.conf (no RDMA hardware on vmhost03)
  become: true
  community.general.ini_file:
    path: /etc/nfs.conf
    section: nfsd
    option: rdma
    value: "n"
    mode: '0644'
  notify: Restart nfs-server
  tags: nas_nfs

- name: Remove rdma-port from nfs.conf
  become: true
  community.general.ini_file:
    path: /etc/nfs.conf
    section: nfsd
    option: rdma-port
    state: absent
  notify: Restart nfs-server
  tags: nas_nfs

- name: Ensure /var/lib/nfs is owned by root with correct permissions
  become: true
  ansible.builtin.file:
    path: /var/lib/nfs
    owner: root
    group: root
    mode: '0755'
  tags: nas_nfs

- name: Ensure NFS lock files have correct permissions
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0644'
    state: touch
    modification_time: preserve
    access_time: preserve
  loop:
    - /var/lib/nfs/.etab.lock
    - /var/lib/nfs/export-lock
  tags: nas_nfs

- name: Restore SELinux context on /var/lib/nfs
  become: true
  ansible.builtin.command:
    cmd: restorecon -Rv /var/lib/nfs/
  register: _restorecon_result
  changed_when: _restorecon_result.stdout | length > 0
  tags: nas_nfs

- name: Deploy sunrpc modprobe config for NFS slot table tuning
  become: true
  ansible.builtin.copy:
    dest: /etc/modprobe.d/sunrpc.conf
    content: |
      options sunrpc tcp_slot_table_entries=128
      options sunrpc tcp_max_slot_table_entries=128
    owner: root
    group: root
    mode: '0644'
  tags: nas_nfs

- name: Read current tcp_slot_table_entries
  become: true
  ansible.builtin.slurp:
    src: /sys/module/sunrpc/parameters/tcp_slot_table_entries
  register: _sunrpc_slot_current
  tags: nas_nfs

- name: Set tcp_slot_table_entries live
  become: true
  ansible.builtin.shell:
    cmd: echo 128 > /sys/module/sunrpc/parameters/tcp_slot_table_entries
  when: (_sunrpc_slot_current.content | b64decode | trim) != '128'
  tags: nas_nfs

- name: Enable and start NFS server services
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - rpcbind
    - nfs-server
  tags: nas_nfs
