---
- name: Install NFS server packages
  become: true
  ansible.builtin.dnf:
    name:
      - nfs-utils
    state: present
  tags: nas_nfs

- name: Allow NFS to export read-write directories via SELinux
  become: true
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop:
    - nfs_export_all_rw
    - nfs_export_all_ro
  tags: nas_nfs

- name: Deploy NFS exports configuration
  become: true
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: '0644'
  notify: Reload exports
  tags: nas_nfs

- name: Enable and start NFS server services
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - rpcbind
    - nfs-server
  tags: nas_nfs
