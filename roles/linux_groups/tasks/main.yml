---
- name: Ensure groups exist with correct GIDs
  become: true
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid | default(omit) }}"
    state: present
  loop: "{{ linux_groups }}"
  tags: linux_groups

- name: Ensure group members are assigned
  become: true
  ansible.builtin.user:
    name: "{{ item.1 }}"
    groups: "{{ item.0.name }}"
    append: true
  loop: "{{ linux_groups | subelements('members', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }} → {{ item.0.name }}"
  tags: linux_groups
