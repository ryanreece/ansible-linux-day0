---
nas_smb_workgroup: "REECE_AI"
nas_smb_server_string: "vmhost03 NAS"

nas_linux_groups:
  - name: nas-users
    gid: 3000
    members:
      - reece
  - name: nas-family
    gid: 3001
    members:
      - reece
  - name: nas-reece-ai
    gid: 3002
    members:
      - reece
  - name: nas-work
    gid: 3003
    members:
      - reece
  - name: nas-misc
    gid: 3004
    members:
      - reece

nas_shares:
  - name: family
    path: /tank/family
    comment: "Family"
    zfs_dataset: tank/family
    owner: root
    group: nas-family
    mode: "2775"
    samba:
      enabled: true
      browseable: true
      read_only: false
      guest_ok: false
      valid_users: "@nas-family"
      force_group: "nas-family"
      create_mask: "0664"
      directory_mask: "0775"
    nfs:
      enabled: true
      clients:
        - host: "10.0.0.0/8"
          options: "rw,sync,no_subtree_check,root_squash"

  - name: reece_ai
    path: /tank/reece_ai
    comment: "Reece AI"
    zfs_dataset: tank/reece_ai
    owner: root
    group: nas-reece-ai
    mode: "2775"
    samba:
      enabled: true
      browseable: true
      read_only: false
      guest_ok: false
      valid_users: "@nas-reece-ai"
      force_group: "nas-reece-ai"
      create_mask: "0664"
      directory_mask: "0775"
    nfs:
      enabled: true
      clients:
        - host: "10.0.0.0/8"
          options: "rw,sync,no_subtree_check,root_squash"

  - name: work
    path: /tank/work
    comment: "Work"
    zfs_dataset: tank/work
    owner: root
    group: nas-work
    mode: "2775"
    samba:
      enabled: true
      browseable: true
      read_only: false
      guest_ok: false
      valid_users: "@nas-work"
      force_group: "nas-work"
      create_mask: "0664"
      directory_mask: "0775"
    nfs:
      enabled: true
      clients:
        - host: "10.0.0.0/8"
          options: "rw,sync,no_subtree_check,root_squash"

  - name: misc
    path: /tank/misc
    comment: "Misc"
    zfs_dataset: tank/misc
    owner: root
    group: nas-misc
    mode: "2775"
    samba:
      enabled: true
